[project]
name = "evoltris"
version = "0.1.0"
description = "Tetris where the stack evolves as Conway's Game of Life, gated by a chaotic CML and tuned by an adaptive LP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pygame-ce>=2.5.8",
    "scipy>=1.18.1",
]

[project.scripts]
evoltris = "evoltris:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
